# rp-bank-thresholds v1.0.0 — Meridian rule pack (SPEC §1.4 format)
# Banking data-reporting and cash thresholds (NRS/CBN interfaces)
id: rp-bank-thresholds
version: 1.0.0
title: Banking data-reporting and cash thresholds (NRS/CBN interfaces)
description: 'Thresholds for bank reporting to NRS and cash-transaction limits feeding analytics: account reporting thresholds,
  cash withdrawal caps, e-levy references.'
effective_from: '2026-01-01'
effective_to: null
status: published
subject_to_regazette: true
provenance:
  as_passed: Nigeria Tax Administration Act 2025 (third-party reporting); CBN cash withdrawal policy (Dec 2022, revised 2023);
    Money Laundering (Prevention & Prohibition) Act 2022
  as_gazetted: null
  source_citation: NTAA 2025; CBN cash policy circulars 2022/2023; MLPPA 2022
rules:
- id: bank.report.individual
  when:
    account_holder: individual
    monthly_turnover_kobo:
      gte: 2500000000
  then:
    decision: report_to_nrs
    frequency: monthly
    narrate: Banks report individual accounts with monthly turnover >= N25m to NRS (data-sharing rail).
  citation: "NTAA 2025; CBN cash policy circulars 2022/2023; MLPPA 2022"
- id: bank.report.corporate
  when:
    account_holder: corporate
    monthly_turnover_kobo:
      gte: 10000000000
  then:
    decision: report_to_nrs
    frequency: monthly
    narrate: Corporate accounts with monthly turnover >= N100m reportable.
  citation: "NTAA 2025; CBN cash policy circulars 2022/2023; MLPPA 2022"
- id: bank.cash.limit.individual
  when:
    channel: cash_withdrawal
    account_holder: individual
  then:
    threshold:
      weekly_limit_kobo: 50000000
    narrate: 'CBN cash withdrawal cap: N500,000/week individuals (processing fee above).'
  citation: "NTAA 2025; CBN cash policy circulars 2022/2023; MLPPA 2022"
- id: bank.cash.limit.corporate
  when:
    channel: cash_withdrawal
    account_holder: corporate
  then:
    threshold:
      weekly_limit_kobo: 500000000
    narrate: 'CBN cash withdrawal cap: N5,000,000/week corporates.'
  citation: "NTAA 2025; CBN cash policy circulars 2022/2023; MLPPA 2022"
- id: bank.cash.single-report
  when:
    channel: cash
    amount_kobo:
      gte: 500000000
  then:
    decision: scuml_reportable
    narrate: Single cash transactions >= N5m (individual) / N10m (corporate) reportable under MLPPA (SCUML where DNFBP).
  citation: "NTAA 2025; CBN cash policy circulars 2022/2023; MLPPA 2022"
- id: bank.pseudonymise.feed
  when:
    feed: bank_reporting
  then:
    decision: tin_hash_in_analytics
    narrate: Bank feeds land in bronze; analytics planes carry tin_hash only (SPEC 1.3).
  citation: "NTAA 2025; CBN cash policy circulars 2022/2023; MLPPA 2022"
