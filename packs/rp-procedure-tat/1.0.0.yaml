# rp-procedure-tat v1.0.0 — Meridian rule pack (SPEC §1.4 format)
# Tax Appeal Tribunal (TAT) procedure rules
id: rp-procedure-tat
version: 1.0.0
title: Tax Appeal Tribunal (TAT) procedure rules
description: 'Appeal procedure: notice within 30 days of assessment/action, hearing timelines, representation, decision and
  escalation to Federal High Court; TAT assembly metadata for audit-defensibility.'
effective_from: '2026-01-01'
effective_to: null
status: published
subject_to_regazette: true
provenance:
  as_passed: Nigeria Tax Administration Act 2025 — Tax Appeal Tribunal provisions (continuing FIRS Establishment Act 2007,
    Fifth Schedule model)
  as_gazetted: null
  source_citation: NTAA 2025 (TAT); FIRS(Establishment) Act 2007 Fifth Schedule (legacy)
rules:
- id: tat.notice.window
  when:
    event: notice_of_assessment_or_refusal
  then:
    appeal_within_days: 30
    decision: time_barred_after
    narrate: Notice of appeal within 30 days of the assessment, demand notice or refusal to amend.
  citation: "NTAA 2025 (TAT); FIRS(Establishment) Act 2007 Fifth Schedule (legacy)"
- id: tat.deposit.prereq
  when:
    appeal: filed
    tax:
      in:
      - CIT
      - VAT
      - WHT
  then:
    decision: see_rp_deposit_20pct
    narrate: Appeal admissibility may require the 20% deposit (rp-deposit-20pct) per NTAA.
  citation: "NTAA 2025 (TAT); FIRS(Establishment) Act 2007 Fifth Schedule (legacy)"
- id: tat.fixture
  when:
    appeal: admitted
  then:
    decision: fix_hearing
    within_days: 60
    narrate: TAT fixes hearing; parties notified >= 14 days before sitting.
  citation: "NTAA 2025 (TAT); FIRS(Establishment) Act 2007 Fifth Schedule (legacy)"
- id: tat.representation
  when:
    party:
      in:
      - appellant
      - respondent
  then:
    decision: self_or_counsel
    narrate: Parties may appear personally, by legal practitioner or by chartered tax practitioner/accountant.
  citation: "NTAA 2025 (TAT); FIRS(Establishment) Act 2007 Fifth Schedule (legacy)"
- id: tat.decision.timeline
  when:
    hearing: concluded
  then:
    decision_within_days: 60
    narrate: Decision after conclusion of hearing; written reasons served on parties.
  citation: "NTAA 2025 (TAT); FIRS(Establishment) Act 2007 Fifth Schedule (legacy)"
- id: tat.escalation
  when:
    decision: tat
  then:
    appeal_to: Federal High Court
    within_days: 30
    'on': questions_of_law
    narrate: Further appeal to FHC within 30 days, on points of law.
  citation: "NTAA 2025 (TAT); FIRS(Establishment) Act 2007 Fifth Schedule (legacy)"
- id: tat.trail.metadata
  when:
    service: case-mgmt
  then:
    decision: emit_tat_metadata
    narrate: Technical-audit-trail records who saw what, when, under which rule_pack_version (audit-evidence svc).
  citation: "NTAA 2025 (TAT); FIRS(Establishment) Act 2007 Fifth Schedule (legacy)"
