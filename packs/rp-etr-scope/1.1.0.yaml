# rp-etr-scope v1.1.0 — Meridian rule pack (SPEC §1.4 format)
# GloBE/ETR scope thresholds and excluded entities
id: rp-etr-scope
version: 1.1.0
title: GloBE/ETR scope thresholds and excluded entities
description: 'Scope gate for the ETR engine: EUR 750m consolidated revenue test (2 of 4 preceding fiscal years), excluded
  entities, N50bn domestic overlay (framework-only: the etr engine has no domestic-overlay lookup). v1.1.0 adds engine-lookup
  alias rules (underscore IDs) matching the compliance-suite etr service contract in services/etr/app/packs.py exactly
  (revenue_threshold = GloBE EUR 750m scope test; exclusions in engine vocabulary); canonical hyphen IDs retained.'
effective_from: '2026-01-01'
effective_to: null
status: published
subject_to_regazette: true
provenance:
  as_passed: 'OECD/G20 Inclusive Framework: Tax Challenges Arising from the Digitalisation of the Economy - Global Anti-Base
    Erosion Model Rules (Pillar Two), Dec 2021; adopted in Nigeria via NTAA 2025 s.6(4)'
  as_gazetted: null
  source_citation: OECD Pillar Two GloBE Model Rules (2021), Art. 1.1-1.5; Nigeria Tax Administration Act 2025 s.6
rules:
- id: etr.scope.revenue-test
  when:
    group: mne
  then:
    threshold:
      consolidated_revenue_eur: 750000000
      test: revenue >= 750m EUR in at least 2 of the 4 fiscal years immediately preceding the tested year
    narrate: 'GloBE scope: consolidated group revenue >= EUR 750m in 2 of 4 preceding years.'
  citation: GloBE Model Rules Art. 1.1.1
- id: etr.scope.excluded-entities
  when:
    entity_type:
      in:
      - governmental_entity
      - international_organisation
      - nonprofit_organisation
      - pension_fund
      - investment_fund_upe
      - real_estate_investment_vehicle_upe
  then:
    decision: excluded
    narrate: Excluded entities per GloBE Art. 1.5.
- id: etr.scope.excluded-services
  when:
    activity:
      in:
      - international_shipping
  then:
    decision: excluded_income
    narrate: International shipping income excluded from GloBE income (Art. 3.3).
- id: etr.scope.de-minimis
  when:
    jurisdiction_avg_revenue_eur:
      lt: 10000000
    jurisdiction_avg_income_eur:
      lt: 1000000
  then:
    decision: de_minimis_no_topup
    narrate: 'De minimis: no top-up where average jurisdictional revenue < EUR 10m and income < EUR 1m (3-year average).'
  citation: GloBE Model Rules Art. 8.2
- id: etr.scope.domestic-overlay
  when:
    group: domestic
    aggregate_turnover_kobo:
      gte: 5000000000000
  then:
    decision: in_scope_nta
    narrate: 'NTA overlay: domestic groups at N50bn+ treated in scope of the 15% minimum ETR (rp-etr-nta).
      FRAMEWORK-ONLY: the compliance-suite etr engine (services/etr/app/packs.py) performs no lookup for this
      rule; it is NOT aliased to etr.scope.revenue_threshold, which is the GloBE EUR 750m scope test.'
- id: etr.scope.revenue_threshold
  description: Engine-lookup alias of etr.scope.revenue-test (etr service underscore ID contract, services/etr/app/packs.py
    revenue_threshold_kobo()). This ID is the GloBE EUR 750m scope test in the engine, NOT the N50bn domestic overlay
    (the engine has no domestic-overlay lookup; etr.scope.domestic-overlay is framework-only).
  when:
    group: mne
  then:
    threshold_ngn_kobo: 12000000000000000
    threshold_note: EUR 750m consolidated revenue, NGN kobo equivalent (matches engine default 12_000_000_000_000_000)
    narrate: 'MNE group in scope when consolidated revenue >= EUR 750m in 2 of 4 prior years. Alias of etr.scope.revenue-test;
      value matches the engine embedded fallback exactly (12,000,000,000,000,000 kobo).'
  citation: GloBE Model Rules Art. 1.1.1; NTA 2025, s.57
- id: etr.scope.exclusions
  description: Engine-lookup alias of etr.scope.excluded-entities (etr service underscore ID contract).
  when:
    entity_type:
      in:
      - governmental_entity
      - international_organisation
      - nonprofit_organisation
      - pension_fund
      - investment_fund_upe
      - real_estate_investment_vehicle_upe
  then:
    excluded_entity_types:
    - governmental
    - international_org
    - non_profit
    - pension_fund
    - investment_fund_upe
    - real_estate_investment_vehicle_upe
    narrate: 'Excluded entities per GloBE Art. 1.5, in the etr engine vocabulary (services/etr embedded pack:
      international_org, not international_organisation). Alias of etr.scope.excluded-entities.'
  citation: GloBE Model Rules Art. 1.5
