# rp-disclosure-control v1.0.0 — Meridian rule pack (SPEC §1.4 format)
# Statistical disclosure control for analytics outputs (k-anonymity k=5)
id: rp-disclosure-control
version: 1.0.0
title: Statistical disclosure control for analytics outputs (k-anonymity k=5)
description: 'Disclosure control on gold-plane aggregates: k-anonymity k>=5 for any published cell, suppression rules, differencing
  protection, pseudonymisation requirement (NDPA).'
effective_from: '2025-01-01'
effective_to: null
status: published
subject_to_regazette: true
provenance:
  as_passed: Meridian analytics governance implementing Nigeria Data Protection Act 2023 and NRS data-governance policy
  as_gazetted: null
  source_citation: NDPA 2023; NRS data governance & confidentiality policy
rules:
- id: disclosure.k-anonymity
  when:
    output: aggregate_cell
  then:
    threshold:
      k: 5
    decision: suppress_if_below
    narrate: 'k-anonymity: any published aggregate cell must represent at least k=5 distinct taxpayers; below k the cell is
      suppressed.'
  citation: NDPA 2023; NRS data governance & confidentiality policy
- id: disclosure.complementary-suppression
  when:
    cell: suppressed
    derivable_from: other_published_cells
  then:
    decision: suppress_complement
    narrate: 'Complementary suppression: suppress additional cells so a sub-k cell cannot be derived by subtraction.'
  citation: NDPA 2023; NRS data governance & confidentiality policy
- id: disclosure.dominance
  when:
    cell: aggregate
    top2_share_gte: 0.85
  then:
    decision: suppress
    narrate: 'Dominance rule: suppress cells where the largest 2 contributors account for >= 85% of the total (p*q rule).'
  citation: NDPA 2023; NRS data governance & confidentiality policy
- id: disclosure.differencing
  when:
    queries: overlapping
  then:
    decision: rate_limit_and_audit
    narrate: 'Overlapping query protection: rate-limit, audit query patterns, and round published values to protect against
      differencing attacks.'
  citation: NDPA 2023; NRS data governance & confidentiality policy
- id: disclosure.pseudonym
  when:
    plane: gold
  then:
    decision: pseudo_tin_only
    narrate: Gold plane exposes pseudo_tin (HMAC) only; re-identification attempts are a security incident.
  citation: NDPA 2023; NRS data governance & confidentiality policy
- id: disclosure.case-feed.min-cohort
  when:
    feed: nrs.cases.feed.v1
  then:
    threshold:
      min_cohort: 5
    narrate: Case feed items aggregated to cohorts >= 5 before leaving the enclave (F-flow rules).
  citation: NDPA 2023; NRS data governance & confidentiality policy
