# rp-vat-exempt-basket v1.0.0 — Meridian rule pack (SPEC §1.4 format)
# VAT exempt basket (goods and services)
id: rp-vat-exempt-basket
version: 1.0.0
title: VAT exempt basket (goods and services)
description: 'Exempt supplies: humanitarian/religious non-commercial, shared passenger transport, plays/performances, real
  property (land/building), money/securities transactions. LEGACY (pre-2026) exemptions retained for medical/educational services
  and exported services, which NTA 2025 s.187 moves to the zero-rated basket from 2026-01-01.'
effective_from: '2026-01-01'
effective_to: null
status: published
subject_to_regazette: true
provenance:
  as_passed: VAT Act First Schedule (as amended by Finance Acts 2019-2021); Nigeria Tax Act 2025 exemption schedule
  as_gazetted: null
  source_citation: VAT Act (as amended) First Schedule; Nigeria Tax Act 2025
rules:
- id: vat.exempt.medical-services-legacy
  when:
    item_class: medical_services
    date:
      lt: '2026-01-01'
  then:
    decision: exempt
    narrate: 'LEGACY (pre-NTA): medical and healthcare services were EXEMPT before 2026. Under NTA 2025 s.187 they move to
      ZERO-RATED (rp-vat-zerorated-basket vat.zero.medical-services) with input VAT recovery.'
  citation: VAT Act (as amended) First Schedule; NTA 2025 s.187
  effective_to: '2025-12-31'
- id: vat.exempt.education-services-legacy
  when:
    item_class: educational_services
    date:
      lt: '2026-01-01'
  then:
    decision: exempt
    narrate: 'LEGACY (pre-NTA): educational services (tuition) were EXEMPT before 2026. Under NTA 2025 s.187 tuition at nursery/primary/secondary/tertiary
      levels moves to ZERO-RATED (rp-vat-zerorated-basket vat.zero.education-tuition).'
  citation: VAT Act (as amended) First Schedule; NTA 2025 s.187
  effective_to: '2025-12-31'
- id: vat.exempt.shared-transport
  when:
    item_class: shared_passenger_road_transport
  then:
    decision: exempt
    narrate: Shared passenger road transport exempt.
- id: vat.exempt.plays-performance
  when:
    item_class: plays_performances_conducted_by_educational
  then:
    decision: exempt
    narrate: Plays and performances conducted by educational institutions as part of learning.
- id: vat.exempt.real-property
  when:
    item_class:
      in:
      - land
      - building
      - lease_or_rental_of_real_property
  then:
    decision: exempt
    narrate: Land, buildings and their lease/rental exempt.
- id: vat.exempt.money-securities
  when:
    item_class:
      in:
      - money
      - securities
      - financial_instruments
  then:
    decision: exempt
    narrate: Money and securities transactions exempt (fees/commissions for financial services remain taxable).
- id: vat.exempt.humanitarian
  when:
    item_class: non_commercial_humanitarian_religious
  then:
    decision: exempt
    narrate: Non-commercial supplies by humanitarian/religious bodies.
- id: vat.exempt.exported-services-legacy
  when:
    item_class: exported_services
    date:
      lt: '2026-01-01'
  then:
    decision: exempt
    narrate: Exported services were EXEMPT before 2026; under NTA they move to ZERO-RATED (rp-vat-zerorated-basket) with input
      recovery.
  effective_to: '2025-12-31'
