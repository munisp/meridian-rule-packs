# rp-presumptive-federal v1.0.0 — Meridian rule pack (SPEC §1.4 format)
# Federal presumptive tax band amounts (NRS / FCT default)
id: rp-presumptive-federal
version: 1.0.0
title: Federal presumptive tax band amounts (NRS / FCT default)
description: 'Federal default presumptive band table: fixed annual tax per turnover band for informal-sector operators. Payment
  via PSM rail (T12); certificate issued on payment.'
effective_from: '2026-01-01'
effective_to: null
status: published
subject_to_regazette: true
provenance:
  as_passed: NRS informal-sector presumptive taxation framework under NTA 2025 (regulations awaited)
  as_gazetted: null
  source_citation: Nigeria Tax Act 2025; NRS Presumptive Tax Framework (draft regulations, post-regulation gate armed)
rules:
- id: presumptive.table.federal
  when:
    jurisdiction: federal
    operator: informal
  then:
    table:
    - band: micro
      annual_tax_kobo: 250000
    - band: small
      annual_tax_kobo: 750000
    - band: lower_medium
      annual_tax_kobo: 1500000
    - band: medium
      annual_tax_kobo: 3000000
    - band: upper_medium
      annual_tax_kobo: 6000000
    - band: large_informal
      annual_tax_kobo: 12000000
    narrate: Federal presumptive annual amounts per turnover band
  citation: "Nigeria Tax Act 2025; NRS Presumptive Tax Framework (draft regulations, post-regulation gate armed)"
- id: presumptive.eligibility
  when:
    operator: informal
    tin_registered: false
  then:
    decision: eligible
    narrate: Unregistered informal operators in turnover bands 1-6 pay presumptive amounts in lieu of PIT.
  citation: "Nigeria Tax Act 2025; NRS Presumptive Tax Framework (draft regulations, post-regulation gate armed)"
- id: presumptive.exempt.micro
  when:
    band: micro
    annual_turnover_kobo:
      lte: 80000000
  then:
    rate_bps: 0
    narrate: Operators at or below the N800,000 PIT-exempt line pay nothing (but may register voluntarily).
  citation: "Nigeria Tax Act 2025; NRS Presumptive Tax Framework (draft regulations, post-regulation gate armed)"
- id: presumptive.payment.certificate
  when:
    payment_status: captured
  then:
    decision: issue_certificate
    narrate: On captured payment, issue presumptive tax certificate with verifiable serial (T12).
  citation: "Nigeria Tax Act 2025; NRS Presumptive Tax Framework (draft regulations, post-regulation gate armed)"
- id: presumptive.split.levy
  when:
    payment_status: captured
  then:
    formula: levy_split(attribution_state)
    narrate: Amount split per attribution feed (rp-attribution-formula) between state and federal share where applicable.
  citation: "Nigeria Tax Act 2025; NRS Presumptive Tax Framework (draft regulations, post-regulation gate armed)"
